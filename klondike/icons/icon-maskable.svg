<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="felt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a6b40"/>
      <stop offset="100%" stop-color="#0a3a22"/>
    </linearGradient>
    <path id="heart" d="M0 33 C -44 0 -44 -38 -11 -38 C 0 -38 0 -27 0 -22 C 0 -27 0 -38 11 -38 C 44 -38 44 0 0 33 Z"/>
    <polygon id="diamond" points="0,-46 35,0 0,46 -35,0"/>
    <g id="spade">
      <use href="#heart" transform="scale(1,-1)"/>
      <polygon points="-9,30 9,30 0,58"/>
    </g>
  </defs>

  <rect width="512" height="512" fill="url(#felt)"/>

  <!-- Content scaled/centered to sit inside the maskable safe zone (centered
       80%-diameter circle), so OS icon masks (circle, squircle, rounded square)
       never clip the outer cards. -->
  <g transform="translate(256 256) scale(0.72) translate(-256 -256)">
    <g transform="rotate(-16 256 470)">
      <rect x="171" y="210" width="170" height="250" rx="20" fill="#f7f3e8" stroke="rgba(0,0,0,0.25)" stroke-width="3"/>
      <use href="#spade" fill="#1c1c1c" transform="translate(256 340) scale(1.9)"/>
    </g>
    <g transform="rotate(16 256 470)">
      <rect x="171" y="210" width="170" height="250" rx="20" fill="#f7f3e8" stroke="rgba(0,0,0,0.25)" stroke-width="3"/>
      <use href="#diamond" fill="#c0392b" transform="translate(256 340) scale(1.9)"/>
    </g>
    <g>
      <rect x="171" y="210" width="170" height="250" rx="20" fill="#f7f3e8" stroke="rgba(0,0,0,0.25)" stroke-width="3"/>
      <use href="#heart" fill="#c0392b" transform="translate(256 340) scale(1.9)"/>
    </g>
  </g>
</svg>
