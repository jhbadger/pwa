<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Jigsaw</title>
<meta name="description" content="Offline jigsaw puzzles from bundled art or your own photos.">
<meta name="theme-color" content="#152a30">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-512.png" sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Jigsaw">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="css/style.css">

<script>
  // Must run during head parse, before any layout, so standalone-only chrome
  // never flashes on screen before disappearing.
  (function () {
    var standalone = window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;
    document.documentElement.classList.add(standalone ? 'standalone' : 'browser-tab');
  })();
</script>

<script>
  // Register as early as possible (during parse), not on window.load — waiting for
  // every subresource means warming the cache last on the slow connection that needs it most.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</head>
<body>

<div class="app">
  <header class="topbar">
    <h1 class="title">Jigsaw</h1>
    <p class="status" id="status" aria-live="polite">&nbsp;</p>
  </header>

  <!-- ---------- setup screen: choose an image and piece count ---------- -->
  <main class="setup" id="setupScreen">
    <p class="setup-lead">Pick an image, or use one of your own.</p>

    <div class="picker" id="picker" role="list"></div>

    <label class="filebtn" id="filebtnLabel">
      <input type="file" id="photoInput" accept="image/*" hidden>
      <span id="fileLabelText">Choose a photo&hellip;</span>
    </label>

    <div class="piececount">
      <label for="pieceSlider">Pieces: <span id="pieceCountLabel">24</span></label>
      <input type="range" id="pieceSlider" min="6" max="150" value="24" step="1">
    </div>

    <button type="button" class="btn btn-primary" id="btnStart" disabled>Start Puzzle</button>
    <button type="button" class="btn btn-ghost" id="btnResume" hidden>Resume saved puzzle</button>
  </main>

  <!-- ---------- game screen: canvas + toolbar ---------- -->
  <div class="game-slot" id="gameScreen" hidden>
    <canvas id="board" aria-label="Jigsaw puzzle board"></canvas>
  </div>

  <footer class="toolbar" id="toolbar" hidden>
    <button type="button" class="tbtn" id="btnReshuffle" aria-label="Reshuffle pieces">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0020 13c0-4.42-3.58-8-8-8zm-6 8c0-1.01.25-1.97.7-2.8L5.24 8.74A7.93 7.93 0 004 13c0 4.42 3.58 8 8 8v3l5-4-5-4v3c-3.31 0-6-2.69-6-6z"/></svg>
      <span>Reshuffle</span>
    </button>
    <button type="button" class="tbtn" id="btnHint" aria-label="Toggle hint image" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C8.13 2 5 5.13 5 9c0 2.38 1.19 4.47 3 5.74V17a1 1 0 001 1h6a1 1 0 001-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.87-3.13-7-7-7zM9 21a1 1 0 001 1h4a1 1 0 001-1v-1H9v1z"/></svg>
      <span>Hint</span>
    </button>
    <button type="button" class="tbtn" id="btnNewPuzzle" aria-label="New puzzle">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 13H5v-2h14v2z"/></svg>
      <span>New</span>
    </button>
  </footer>

  <div class="win-overlay" id="winOverlay" hidden>
    <div class="win-card">
      <h2>Puzzle Complete!</h2>
      <button type="button" class="btn btn-primary" id="btnWinNew">New Puzzle</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
