<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Pipe Dream</title>
<meta name="description" content="Lay pipe ahead of the water before it leaks — with sound effects.">
<meta name="theme-color" content="#10181c">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-512.png" sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Pipe Dream">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="css/style.css">

<script>
  // Must run during head parse, before any layout, so standalone-only chrome
  // never flashes on screen before disappearing.
  (function () {
    var standalone = window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;
    document.documentElement.classList.add(standalone ? 'standalone' : 'browser-tab');
  })();
</script>

<script>
  // Register as early as possible (during parse), not on window.load — waiting for
  // every subresource means warming the cache last on the slow connection that needs it most.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</head>
<body>

<div class="app">
  <header class="topbar">
    <h1 class="title">Pipe Dream</h1>
    <p class="status" id="status" aria-live="polite">Lay pipe before the water starts</p>
  </header>

  <div class="queue-row">
    <span class="queue-label">Next:</span>
    <div class="queue-tiles" id="queueTiles"></div>
  </div>

  <div class="board-slot">
    <div class="board-frame">
      <div class="board" id="board" role="grid" aria-label="Pipe board"></div>
    </div>
  </div>

  <div class="stats" id="stats">Score: 0 &nbsp;·&nbsp; Best: 0</div>

  <footer class="toolbar">
    <button type="button" class="tbtn" id="btnNewGame">New Game</button>
  </footer>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
