<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#242c3c"/>
      <stop offset="100%" stop-color="#12151d"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0b478"/>
      <stop offset="100%" stop-color="#d47f34"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Content scaled/centered to sit inside the maskable safe zone (centered
       80%-diameter circle), so OS icon masks (circle, squircle, rounded square)
       never clip the glyph. -->
  <g transform="translate(256 256) scale(0.72) translate(-256 -256)">
    <text x="256" y="336" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="320" fill="url(#mark)">?</text>
  </g>
</svg>
