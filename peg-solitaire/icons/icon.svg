<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a5a34"/>
      <stop offset="100%" stop-color="#4a2e18"/>
    </linearGradient>
    <radialGradient id="peg" cx="34%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#f0d5a0"/>
      <stop offset="100%" stop-color="#a5763c"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#wood)"/>
  <g>
    <!-- cross-shaped arrangement of holes/pegs, 3 across the middle rows/cols -->
    <!-- holes (dark) -->
    <g fill="#140d09">
      <circle cx="256" cy="118" r="40"/>
      <circle cx="118" cy="256" r="40"/>
      <circle cx="394" cy="256" r="40"/>
      <circle cx="256" cy="394" r="40"/>
      <circle cx="187" cy="187" r="40"/>
      <circle cx="325" cy="187" r="40"/>
      <circle cx="187" cy="325" r="40"/>
      <circle cx="325" cy="325" r="40"/>
    </g>
    <!-- center hole stays empty (the traditional starting gap) -->
    <circle cx="256" cy="256" r="40" fill="#0e0906"/>
    <!-- pegs -->
    <g fill="url(#peg)">
      <circle cx="256" cy="118" r="30"/>
      <circle cx="118" cy="256" r="30"/>
      <circle cx="394" cy="256" r="30"/>
      <circle cx="256" cy="394" r="30"/>
      <circle cx="187" cy="187" r="30"/>
      <circle cx="325" cy="187" r="30"/>
      <circle cx="187" cy="325" r="30"/>
      <circle cx="325" cy="325" r="30"/>
    </g>
  </g>
</svg>
