<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Pocket Arcade</title>
<meta name="description" content="Classic 1980s arcade games — Space Invaders and more.">
<meta name="theme-color" content="#0a0a0f">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-512.png" sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Pocket Arcade">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="css/style.css">

<script>
  (function () {
    var standalone = window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;
    document.documentElement.classList.add(standalone ? 'standalone' : 'browser-tab');
  })();
  (function () {
    // Picks which way to rotate the page for the landscape-hold CSS (see
    // style.css) so it comes out right-side-up regardless of which edge of
    // the phone the user rotated up.
    function updateLandscapeFlip() {
      var flip = false;
      if (screen.orientation && screen.orientation.type) {
        flip = screen.orientation.type === 'landscape-secondary';
      } else if (typeof window.orientation === 'number') {
        flip = window.orientation === -90;
      }
      document.documentElement.classList.toggle('landscape-flip', flip);
    }
    window.addEventListener('orientationchange', updateLandscapeFlip);
    window.addEventListener('resize', updateLandscapeFlip);
    if (screen.orientation) screen.orientation.addEventListener('change', updateLandscapeFlip);
    updateLandscapeFlip();
  })();
</script>
</head>
<body>

<header>
  <h1>Space Invaders</h1>
</header>

<div id="screen-wrap">
  <canvas id="screen"></canvas>
</div>

<div id="controls">
  <div class="ctrl-group">
    <button class="ctrl-btn btn-small" id="btn-coin">COIN</button>
    <button class="ctrl-btn btn-small" id="btn-start">1P</button>
  </div>
  <div class="ctrl-group">
    <button class="ctrl-btn btn-arrow" id="btn-left">&#9664;</button>
    <button class="ctrl-btn btn-arrow" id="btn-right">&#9654;</button>
  </div>
  <div class="ctrl-group">
    <button class="ctrl-btn btn-action" id="btn-fire">FIRE</button>
  </div>
</div>

<div id="overlay">
  <div class="logo-text">POCKET ARCADE</div>
  <div class="sub-text">Space Invaders &middot; 1978</div>
  <button id="btn-play">INSERT COIN</button>
  <div class="help-text">
    Arrow keys: move &nbsp;&bull;&nbsp; Space: fire<br>
    C: insert coin &nbsp;&bull;&nbsp; Enter: 1P Start<br>
    Gamepad: D-pad/stick move &nbsp;&bull;&nbsp; A: fire &nbsp;&bull;&nbsp; Start: coin + begin
  </div>
  <div id="error-msg"></div>
</div>

<script src="js/roms.js"></script>
<script src="js/i8080.js"></script>
<script src="js/machine.js"></script>
<script src="js/audio.js"></script>
<script src="js/main.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>
