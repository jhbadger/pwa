<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Battlezone</title>
<meta name="description" content="Classic 1980s arcade games — Battlezone.">
<meta name="theme-color" content="#0a0a0f">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icons/icon-512.png" sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Battlezone">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="../css/style.css">

<script>
  (function () {
    var standalone = window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;
    document.documentElement.classList.add(standalone ? 'standalone' : 'browser-tab');
  })();
  (function () {
    var state = localStorage.getItem('pa-rotate-state-battlezone') || 'off';
    document.documentElement.classList.toggle('landscape-mode', state !== 'off');
    document.documentElement.classList.toggle('landscape-flip', state === 'flip');
  })();
</script>
</head>
<body>

<header>
  <a id="btn-menu" href="../" aria-label="Back to arcade menu">&#8962;</a>
  <h1>Battlezone</h1>
  <button id="btn-rotate" aria-label="Toggle landscape rotation">&#8635;</button>
</header>

<div id="screen-wrap">
  <canvas id="screen"></canvas>
</div>

<div id="controls">
  <div class="ctrl-group">
    <button class="ctrl-btn btn-small" id="btn-coin">COIN</button>
    <button class="ctrl-btn btn-small" id="btn-start1">1P</button>
    <button class="ctrl-btn btn-small" id="btn-start2">2P</button>
  </div>
  <div class="ctrl-group">
    <div class="ctrl-rows">
      <button class="ctrl-btn btn-med" id="btn-left-up" aria-label="Left tread forward">L&#9650;</button>
      <button class="ctrl-btn btn-med" id="btn-left-down" aria-label="Left tread reverse">L&#9660;</button>
    </div>
    <button class="ctrl-btn btn-med" id="btn-fire">FIRE</button>
    <div class="ctrl-rows">
      <button class="ctrl-btn btn-med" id="btn-right-up" aria-label="Right tread forward">R&#9650;</button>
      <button class="ctrl-btn btn-med" id="btn-right-down" aria-label="Right tread reverse">R&#9660;</button>
    </div>
  </div>
</div>

<div id="overlay">
  <div class="logo-text">POCKET ARCADE</div>
  <div class="sub-text">Battlezone &middot; 1980</div>
  <div id="error-msg"></div>
</div>

<script src="js/roms.js"></script>
<script src="js/m6502.js"></script>
<script src="js/avg.js"></script>
<script src="js/mathbox.js"></script>
<script src="js/pokey.js"></script>
<script src="js/machine.js"></script>
<script src="js/audio.js"></script>
<script src="js/main.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' });
  }
</script>
</body>
</html>
