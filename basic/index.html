<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>BASIC</title>
<meta name="description" content="A line-numbered BASIC interpreter with canvas graphics and sound, right in your browser.">
<meta name="theme-color" content="#06140c">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-512.png" sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="BASIC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="css/style.css">

<script>
  // Must run during head parse, before any layout, so standalone-only chrome
  // never flashes on screen before disappearing.
  (function () {
    var standalone = window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;
    document.documentElement.classList.add(standalone ? 'standalone' : 'browser-tab');
  })();
</script>

<script>
  // Register as early as possible (during parse), not on window.load — waiting for
  // every subresource means warming the cache last on the slow connection that needs it most.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</head>
<body>

<div class="app">
  <header class="topbar">
    <h1 class="title">BASIC</h1>
    <button type="button" class="stopbtn" id="btnStop" hidden aria-label="Stop the running program">STOP</button>
  </header>

  <div class="content">
    <div class="gfxWrap" id="gfxWrap" hidden>
      <canvas id="gfx" width="640" height="480" aria-label="Program graphics output"></canvas>
    </div>
    <pre class="screen" id="screen" aria-live="polite" aria-label="BASIC output"></pre>
  </div>

  <div class="inputRow">
    <span class="prompt" id="prompt">&gt;</span>
    <input class="cmdline" id="cmdline" type="text" autocomplete="off" autocapitalize="off"
           autocorrect="off" spellcheck="false" inputmode="text" aria-label="BASIC input line">
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
