<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Library</title>
<meta name="description" content="Read classic literature offline — pick a book off the shelf and turn its pages.">
<meta name="theme-color" content="#241a12">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-512.png" sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Library">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="css/style.css">

<script>
  // Must run during head parse, before any layout, so standalone-only chrome
  // never flashes on screen before disappearing.
  (function () {
    var standalone = window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;
    document.documentElement.classList.add(standalone ? 'standalone' : 'browser-tab');
  })();
</script>

<script>
  // Register as early as possible (during parse), not on window.load — waiting for
  // every subresource means warming the cache last on the slow connection that needs it most.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</head>
<body>

<div class="app">

  <section class="view bookcase-view" id="bookcaseView">
    <header class="topbar">
      <h1 class="title">Library</h1>
      <p class="status">Tap a book to start reading</p>
    </header>
    <div class="shelf-wrap" id="shelfWrap">
      <div class="shelf" id="shelf"></div>
    </div>
  </section>

  <section class="view reader-view hidden" id="readerView">
    <header class="reader-topbar">
      <button type="button" class="btn-back" id="btnBack" aria-label="Back to library">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg>
      </button>
      <div class="reader-heading">
        <div class="reader-book-title" id="readerBookTitle"></div>
        <div class="reader-chapter" id="readerChapter"></div>
      </div>
      <div class="btn-back-spacer" aria-hidden="true"></div>
    </header>

    <div class="book" id="book">
      <div class="page" id="page">
        <div class="page-face page-under" id="pageUnder"></div>
        <div class="page-face page-leaf" id="pageLeaf"></div>
      </div>
    </div>
    <div class="measure" id="measure" aria-hidden="true"></div>

    <footer class="reader-footer">
      <span id="pageIndicator"></span>
    </footer>
  </section>

</div>

<div class="toast" id="toast" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
