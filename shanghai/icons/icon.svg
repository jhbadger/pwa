<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#7a2325"/>
      <stop offset="100%" stop-color="#2e0b0c"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- A "Circles" suit tile (nine dots) peeking behind the front tile, plus the
       front tile showing three dots — drawn as plain vector circles so the icon
       never depends on a CJK/mahjong font being installed at build time. -->
  <g transform="rotate(8 256 256) translate(60 -10)">
    <rect x="146" y="96" width="190" height="260" rx="16" fill="#e9dfc8" stroke="#00000022" stroke-width="2"/>
  </g>
  <g transform="rotate(-7 256 256) translate(-10 6)">
    <rect x="146" y="96" width="220" height="304" rx="18" fill="#f7f3ea" stroke="#00000022" stroke-width="2"/>
    <g fill="#b5342f">
      <circle cx="212" cy="176" r="20"/>
      <circle cx="298" cy="176" r="20"/>
      <circle cx="255" cy="248" r="22"/>
      <circle cx="212" cy="320" r="20"/>
      <circle cx="298" cy="320" r="20"/>
    </g>
    <g fill="#2f6e46">
      <circle cx="212" cy="176" r="9"/>
      <circle cx="298" cy="176" r="9"/>
      <circle cx="255" cy="248" r="10"/>
      <circle cx="212" cy="320" r="9"/>
      <circle cx="298" cy="320" r="9"/>
    </g>
  </g>
</svg>
