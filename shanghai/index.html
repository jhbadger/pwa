<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Shanghai Solitaire</title>
<meta name="description" content="Mahjong tile-matching solitaire — clear the board by pairing free tiles.">
<meta name="theme-color" content="#3a0f10">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-512.png" sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Shanghai">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="css/style.css">

<script>
  // Must run during head parse, before any layout, so standalone-only chrome
  // never flashes on screen before disappearing.
  (function () {
    var standalone = window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;
    document.documentElement.classList.add(standalone ? 'standalone' : 'browser-tab');
  })();
</script>

<script>
  // Register as early as possible (during parse), not on window.load — waiting for
  // every subresource means warming the cache last on the slow connection that needs it most.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</head>
<body>

<div class="app">
  <header class="topbar">
    <h1 class="title">Shanghai Solitaire</h1>
    <p class="status" id="status" aria-live="polite">Tap two matching free tiles</p>
  </header>

  <div class="board-wrap" id="boardWrap">
    <div class="board" id="board"></div>
  </div>

  <div class="stats" id="stats">Tiles left: 144 · Pairs: 0 · Time: 0:00</div>

  <footer class="toolbar">
    <button type="button" class="tbtn" id="btnNew" aria-label="New game">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0020 13c0-4.42-3.58-8-8-8zm-6 8c0-1.01.25-1.97.7-2.8L5.24 8.74A7.93 7.93 0 004 13c0 4.42 3.58 8 8 8v3l5-4-5-4v3c-3.31 0-6-2.69-6-6z"/></svg>
      <span>New</span>
    </button>
    <button type="button" class="tbtn" id="btnUndo" aria-label="Undo last match">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
      <span>Undo</span>
    </button>
    <button type="button" class="tbtn" id="btnHint" aria-label="Hint">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z"/></svg>
      <span>Hint</span>
    </button>
    <button type="button" class="tbtn" id="btnShuffle" aria-label="Shuffle remaining tiles">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      <span>Shuffle</span>
    </button>
  </footer>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
